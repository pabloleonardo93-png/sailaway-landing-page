name: SAILAWAY CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ./frontend

jobs:
  frontend:
    name: Validar frontend
    runs-on: windows-2022

    steps:
      - name: Obter o repositório
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências
        run: npm audit --audit-level=high

      - name: Instalar somente Chromium headless e requisitos
        run: npx --no-install playwright install --with-deps --only-shell chromium

      - name: Executar lint
        run: npm run lint

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Executar testes unitários do formulário
        run: npm test

      - name: Gerar build de produção
        id: build
        run: npm run build

      - name: Verificar integridade dos recursos e referências
        run: node scripts/verificar-integridade.mjs

      - name: Testar SSG e hidratação
        run: npm run test:ssg

      - name: Testar React StrictMode
        run: npm run test:estrito

      - name: Testar SEO e cenários de publicação
        run: npm run test:seo

      - name: Testar interface e referências visuais
        run: npm run test:ui

      - name: Revalidar integridade após os testes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/verificar-integridade.mjs
